name: Lint GitHub Actions workflows
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - .github/workflows/**
      - .github/actions/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        id: actionLint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          # .github/actions/**/*.yml shall be excluded as they are composite and not jobs.
          files: ".github/workflows/*.yml, .github/workflows/*.yaml"
          # $/ is GitHub's self-repository syntax (preferred over ./ by zizmor's self-checkout audit)
          # but actionlint does not recognize it yet, so suppress the resulting errors.
          flags: -ignore SC2086 -ignore '$/.'
          # -ignore 'invalid format because ref is missing'

  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
