name: Build OMB Image

on:
  workflow_dispatch:
    inputs:
      omb_ref:
        description: 'Upstream OMB commit SHA, branch, or tag to build from'
        required: true
        type: string
      kroxylicious_ref:
        description: 'Kroxylicious ref (branch, tag, or SHA) for build config'
        required: false
        default: 'main'
        type: string

env:
  IMAGE_NAME: kroxylicious-omb

permissions:  # added using https://github.com/step-security/secure-repo
  contents: read

jobs:
  build-and-push:
    name: Build and Push OMB Image
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.kroxylicious_ref }}
          persist-credentials: false

      - name: Resolve OMB commit SHA
        id: omb
        env:
          OMB_REF: ${{ inputs.omb_ref }}
        run: |
          if echo "${OMB_REF}" | grep -qE '^[a-f0-9]{7,40}$'; then
            # Looks like a commit SHA — use it directly
            OMB_SHA="${OMB_REF}"
          else
            # Try to resolve as a ref name (branch or tag).
            # git ls-remote output is tab-delimited: <sha>\t<ref>
            OMB_SHA=$(git ls-remote https://github.com/openmessaging/benchmark.git "${OMB_REF}" | cut -f1)
            if [ -z "${OMB_SHA}" ]; then
              echo "::error::Invalid omb_ref '${OMB_REF}': not a known ref in the upstream OMB repository"
              exit 1
            fi
          fi
          echo "sha=${OMB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "short=$(echo "${OMB_SHA}" | cut -c1-7)" >> "${GITHUB_OUTPUT}"

      - name: Compute image tag
        id: tag
        env:
          OMB_SHORT: ${{ steps.omb.outputs.short }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          KROX_SHORT=$(git rev-parse --short=7 HEAD)
          IMAGE_TAG="omb-${OMB_SHORT}-krox-${KROX_SHORT}-${RUN_NUMBER}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "image_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "Image tag: ${IMAGE_TAG}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Determine build configuration
        id: build_configuration
        env:
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
          REGISTRY_ORGANISATION: ${{ vars.REGISTRY_ORGANISATION }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          if [[ "${REGISTRY_SERVER}" != "" ]]; then
            FULL_IMAGE="${REGISTRY_SERVER}/${REGISTRY_ORGANISATION}/${IMAGE_NAME}"
            echo "tags=${FULL_IMAGE}:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
            echo "push_images=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=${IMAGE_NAME}:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
            echo "push_images=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to registry
        if: steps.build_configuration.outputs.push_images == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and maybe push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: kroxylicious-openmessaging-benchmarks
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          file: kroxylicious-openmessaging-benchmarks/Containerfile
          push: ${{ steps.build_configuration.outputs.push_images == 'true' }}
          build-args: |
            OMB_COMMIT=${{ steps.omb.outputs.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.tag.outputs.image_created }}
            org.opencontainers.image.revision=${{ steps.omb.outputs.sha }}
            org.opencontainers.image.source=https://github.com/openmessaging/benchmark
            org.opencontainers.image.version=${{ steps.tag.outputs.image_tag }}
          tags: ${{ steps.build_configuration.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,compression=zstd

      - name: Summary
        env:
          PUSH_IMAGES: ${{ steps.build_configuration.outputs.push_images }}
          IMAGE_TAGS: ${{ steps.build_configuration.outputs.tags }}
        run: |
          if [[ "${PUSH_IMAGES}" == "true" ]]; then
            echo "Pushed ${IMAGE_TAGS}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Registry not configured — image built but not pushed." >> "${GITHUB_STEP_SUMMARY}"
          fi
