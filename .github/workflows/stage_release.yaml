name: Stage Release

# This workflow will stage a kroxylicious release.  The release artefacts will be
# built, signed, and staged on Nexus.  The staging repository will be closed.  A PR will be opened
# containing commits that versions the release and reopen the base branch for development at the next snapshot version.
#
# Once the staged artefacts have been verified, run the workflow deploy_release with the argument `release` to
# release the artefacts to Maven Central and merge the release PR.
#
# It requires the following:
# variables:
# KROXYLICIOUS_SONATYPE_TOKEN_USERNAME        - Sonatype Access User Token Username
# secrets:
# KROXYLICIOUS_RELEASE_TOKEN                  - GitHub PAT, see RELEASING.md for required permissions
# KROXYLICIOUS_RELEASE_PRIVATE_KEY            - Private key of the project admin conducting the release
# KROXYLICIOUS_RELEASE_PRIVATE_KEY_PASSPHRASE - Passphrase used to protect the private key
# KROXYLICIOUS_SONATYPE_TOKEN_PASSWORD        - Sonatype Access User Token Password
#

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'The release version, e.g. 0.7.0'
        required: true
      development-version:
        description: 'The next development version, e.g. 0.7.0-SNAPSHOT'
        required: true
      branch:
        description: 'The branch from which the release is cut'
        required: false
        default: 'main'
      website-repository:
        description: 'The URI of the website repository, starting with everything after the @, e.g. github.com/kroxylicious/kroxylicious.github.io.git'
        required: false
        default: 'github.com/kroxylicious/kroxylicious.github.io.git'
permissions: {}

jobs:
  stage-release:
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}
          persist-credentials: false

      - name: 'Check team membership'
        if: ${{ github.repository == 'kroxylicious/kroxylicious' }}
        uses: tspascoal/get-user-teams-membership@239f45b779d25e70c2e669134c6ed90826f008a1
        id: team-membership
        with:
          username: ${{ github.actor }}
          team: release-engineers
          GITHUB_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}

      - name: 'Stop workflow if user is not a release-engineer'
        if: ${{ github.repository == 'kroxylicious/kroxylicious' && steps.team-membership.outputs.isTeamMember == 'false' }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_ACTOR} is not a member of https://github.com/orgs/kroxylicious/teams/release-engineers)" >&2
          exit 1

      - name: 'Login to container registry'
        if: ${{ vars.REGISTRY_SERVER != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: 'Configure Git username/email'
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      - name: 'Cache Maven packages'
        uses: $/.github/actions/common/cache-maven-packages

      - name: 'Set up Java'
        uses: $/.github/actions/common/setup-java
        with:
          javaVersion: '21'
          javaDistro: 'temurin'
          server-id: central
          server-username: SONATYPE_TOKEN_USERNAME # env variable for Sonatype username
          server-password: SONATYPE_TOKEN_PASSWORD # env variable for Sonatype password
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase
          gpg-private-key: ${{ secrets.KROXYLICIOUS_RELEASE_PRIVATE_KEY }} # Value of the GPG private key to import
          overwrite-settings: 'true'
          mvn-server-repository-origins: central:https://central.sonatype.com

      - name: 'Prepare Release Environment'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "WORK_BRANCH=release-work-${RELEASE_VERSION}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          # This label will be add to the release PR. The run id embedded in the label allows us to download
          # the release state file. This allows us to identify the deployment in Central Publishing Portal.
          RELCAND_ID_LABEL="__relcand_id-${GITHUB_RUN_ID}"
          echo "RELCAND_ID_LABEL=${RELCAND_ID_LABEL}" >> "$GITHUB_ENV"

      - name: 'Create run label used to tag release PRs'
        env:
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
        run: |
          gh label create "${RELCAND_ID_LABEL}" \
                          --description "Used by release workflow to identify the PR for release candidate (${RELEASE_VERSION}). Do not modify." \
                          --force

      - name: 'Lint changelog entries'
        run: mvn --batch-mode dev.logchange:logchange-maven-plugin:lint

      - name: 'Stage Release'
        env:
          SONATYPE_TOKEN_USERNAME: ${{ vars.KROXYLICIOUS_SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.KROXYLICIOUS_SONATYPE_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.KROXYLICIOUS_RELEASE_PRIVATE_KEY_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }} # For the gh cmd line tool used by stage-release.sh
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DEVELOPMENT_VERSION: ${{ github.event.inputs.development-version }}
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SIGNING_KEY_SHORT_NAME=$(gpg --list-public-keys --keyid-format short --with-colons | awk -F: '/^pub:/ {print $5}' | head -n 1)
          ./scripts/stage-release.sh -k "${SIGNING_KEY_SHORT_NAME}" \
                                     -v "${RELEASE_VERSION}" \
                                     -n "${DEVELOPMENT_VERSION}" \
                                     -b "${RELEASE_BRANCH}" \
                                     -w "${WORK_BRANCH}" \
                                     -l "${RELCAND_ID_LABEL}" \
                                     -c "${SERVER_URL}/${REPOSITORY}"
          # Deployment id is the id known to Central Publishing Portal
          echo "DEPLOYMENT_ID=$(cat DEPLOYMENT.ID)" >> "$GITHUB_ENV"

      - name: 'Build and verify release container images'
        env:
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}
        run: |
          # The release branch (rel) was pushed by stage-release.sh and carries exactly the
          # release commit.  We dispatch build-kroxylicious-container-images.yaml on this branch
          # so images are built from the release version and tagged commit-<sha> (no version tag
          # until promote).
          RELEASE_SHA=$(git rev-parse "origin/${WORK_BRANCH}-rel")

          # Capture time before dispatch so the poll can ignore runs from prior staging attempts
          DISPATCH_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-kroxylicious-container-images.yaml \
            --ref "${WORK_BRANCH}-rel" \
            --field push-images=true \
            --field multi-arch=true

          # Poll until the triggered run appears (dispatch registration can take a few seconds)
          RUN_ID=""
          for _ in $(seq 1 12); do
            sleep 10
            RUN_ID=$(DISPATCH_SINCE="${DISPATCH_TIME}" gh api \
              "/repos/${{ github.repository }}/actions/workflows/build-kroxylicious-container-images.yaml/runs?head_sha=${RELEASE_SHA}&event=workflow_dispatch" \
              --jq '[.workflow_runs[] | select(.created_at >= env.DISPATCH_SINCE)] | .[0].id // empty')
            [[ -n "${RUN_ID}" ]] && break
          done
          if [[ -z "${RUN_ID}" ]]; then
            echo "Timed out waiting for build-kroxylicious-container-images workflow run to appear for ${RELEASE_SHA}"
            exit 1
          fi
          gh run watch "${RUN_ID}" --exit-status
          echo "DOCKER_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"

      - name: 'Resolve staged image digests'
        if: ${{ vars.REGISTRY_SERVER != '' }}
        env:
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
          REGISTRY_ORGANISATION: ${{ vars.REGISTRY_ORGANISATION }}
          PROXY_IMAGE_NAME: ${{ vars.PROXY_IMAGE_NAME }}
          OPERATOR_IMAGE_NAME: ${{ vars.OPERATOR_IMAGE_NAME }}
          ADMISSION_IMAGE_NAME: ${{ vars.ADMISSION_IMAGE_NAME }}
        run: |
          SHA_TAG="commit-${RELEASE_SHA}"
          REGISTRY="${REGISTRY_SERVER}"
          ORG="${REGISTRY_ORGANISATION}"
          PROXY="${REGISTRY}/${ORG}/${PROXY_IMAGE_NAME}"
          OPERATOR="${REGISTRY}/${ORG}/${OPERATOR_IMAGE_NAME}"
          ADMISSION="${REGISTRY}/${ORG}/${ADMISSION_IMAGE_NAME}"

          {
            echo "PROXY_DIGEST=$(skopeo inspect "docker://${PROXY}:${SHA_TAG}" | jq -r '.Digest')"
            echo "OPERATOR_DIGEST=$(skopeo inspect "docker://${OPERATOR}:${SHA_TAG}" | jq -r '.Digest')"
            echo "ADMISSION_DIGEST=$(skopeo inspect "docker://${ADMISSION}:${SHA_TAG}" | jq -r '.Digest')"
          } >> "$GITHUB_ENV"

      - name: 'Build release state'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DEVELOPMENT_VERSION: ${{ github.event.inputs.development-version }}
          WEBSITE_REPOSITORY: ${{ github.event.inputs.website-repository }}
          REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER }}
          REGISTRY_ORGANISATION: ${{ vars.REGISTRY_ORGANISATION }}
          PROXY_IMAGE_NAME: ${{ vars.PROXY_IMAGE_NAME }}
          OPERATOR_IMAGE_NAME: ${{ vars.OPERATOR_IMAGE_NAME }}
          ADMISSION_IMAGE_NAME: ${{ vars.ADMISSION_IMAGE_NAME }}
        run: |
          VERSION="${RELEASE_VERSION}"
          # RELEASE_SHA is the pre-merge release commit; it is also what build-kroxylicious-container-images.yaml tagged
          # images with (GITHUB_SHA on the release branch == this commit).
          SHA_TAG="commit-${RELEASE_SHA}"
          REGISTRY="${REGISTRY_SERVER}"
          ORG="${REGISTRY_ORGANISATION}"
          PROXY="${REGISTRY}/${ORG}/${PROXY_IMAGE_NAME}"
          OPERATOR="${REGISTRY}/${ORG}/${OPERATOR_IMAGE_NAME}"
          ADMISSION="${REGISTRY}/${ORG}/${ADMISSION_IMAGE_NAME}"

          jq -n \
            --arg deploymentId "${DEPLOYMENT_ID}" \
            --arg releaseVersion "${VERSION}" \
            --arg developmentVersion "${DEVELOPMENT_VERSION}" \
            --arg workBranch "${WORK_BRANCH}" \
            --arg releaseCommitSha "${RELEASE_SHA}" \
            --arg imageWorkflowRunId "${DOCKER_RUN_ID}" \
            --arg websiteRepository "${WEBSITE_REPOSITORY}" \
            --arg proxyAmd64Ref "${PROXY}:${SHA_TAG}-amd64" \
            --arg proxyArm64Ref "${PROXY}:${SHA_TAG}-arm64" \
            --arg proxyManifest "${PROXY}:${SHA_TAG}" \
            --arg proxyDigest "${PROXY_DIGEST}" \
            --arg operatorManifest "${OPERATOR}:${SHA_TAG}" \
            --arg operatorDigest "${OPERATOR_DIGEST}" \
            --arg admissionManifest "${ADMISSION}:${SHA_TAG}" \
            --arg admissionDigest "${ADMISSION_DIGEST}" \
            '{
              deploymentId: $deploymentId,
              releaseVersion: $releaseVersion,
              developmentVersion: $developmentVersion,
              workBranch: $workBranch,
              releaseCommitSha: $releaseCommitSha,
              imageWorkflowRunId: $imageWorkflowRunId,
              websiteRepository: $websiteRepository,
              stagedArtifacts: {
                proxy: {
                  images: {
                    manifestImage: { ref: $proxyManifest, digest: $proxyDigest },
                    amd64: { ref: $proxyAmd64Ref, builtFrom: { pom: ("io.kroxylicious:kroxylicious-app:" + $releaseVersion + ":pom"), profiles: ["dist"] } },
                    arm64: { ref: $proxyArm64Ref, builtFrom: { pom: ("io.kroxylicious:kroxylicious-app:" + $releaseVersion + ":pom"), profiles: ["dist", "aarch64"] } }
                  }
                },
                operator: {
                  images: {
                    manifestImage: { ref: $operatorManifest, digest: $operatorDigest }
                  },
                  builtFrom: { pom: ("io.kroxylicious:kroxylicious-operator:" + $releaseVersion + ":pom"), profiles: ["dist"] }
                },
                admission: {
                  images: {
                    manifestImage: { ref: $admissionManifest, digest: $admissionDigest }
                  },
                  builtFrom: { pom: ("io.kroxylicious:kroxylicious-admission:" + $releaseVersion + ":pom"), profiles: ["dist"] }
                }
              }
            }' > RELEASE_STATE.json

      - name: 'Archive release state (used by the promote workflow)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RELEASE_STATE.json
          path: RELEASE_STATE.json
          if-no-files-found: error

      - name: 'Archive release notes (used by the promote workflow)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RELEASE_NOTES
          path: .releaseNotes/release-notes_01
          if-no-files-found: error

      - name: 'Collect release assets'
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
        run: |
          VERSION="${RELEASE_VERSION}"
          mkdir release-assets

          copy_dist() {
            local prefix="$1"
            cp "${prefix}.tar.gz" "${prefix}.tar.gz.asc" "${prefix}.zip" "${prefix}.zip.asc" release-assets/
          }

          copy_yaml() {
            local prefix="$1"
            cp "${prefix}-install.yaml" "${prefix}-install.yaml.asc" \
               "${prefix}-crds.yaml" "${prefix}-crds.yaml.asc" release-assets/
          }

          copy_examples() {
            local prefix="$1"
            cp "${prefix}-examples.zip" "${prefix}-examples.zip.asc" release-assets/
          }

          copy_dist "kroxylicious-app/target/kroxylicious-app-${VERSION}-bin"
          copy_dist "kroxylicious-kubernetes/kroxylicious-operator/target/kroxylicious-operator-${VERSION}"
          copy_dist "kroxylicious-kubernetes/kroxylicious-admission/target/kroxylicious-admission-${VERSION}"
          copy_yaml "kroxylicious-kubernetes/kroxylicious-operator/target/kroxylicious-operator-${VERSION}"
          copy_yaml "kroxylicious-kubernetes/kroxylicious-admission/target/kroxylicious-admission-${VERSION}"
          copy_examples "kroxylicious-kubernetes/kroxylicious-operator/target/kroxylicious-operator-${VERSION}"
          copy_examples "kroxylicious-kubernetes/kroxylicious-admission/target/kroxylicious-admission-${VERSION}"
          cp "kroxylicious-api/target/japicmp/japicmp.html" "release-assets/${VERSION}-compatability.html"

      - name: 'Archive release assets (used by the promote workflow)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RELEASE_ASSETS
          path: release-assets/
          if-no-files-found: error

      - name: 'Drop stage repository, if failed'
        if: ${{ failure() &&  env.DEPLOYMENT_ID }}
        env:
          SONATYPE_TOKEN_USERNAME: ${{ vars.KROXYLICIOUS_SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.KROXYLICIOUS_SONATYPE_TOKEN_PASSWORD }}
        run: |
          ./scripts/transition-staging-repository-state.sh -s drop -d "${DEPLOYMENT_ID}"

      - name: 'Drop run label used to tag release PR, if failed'
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}
        run: |
          gh label delete "${RELCAND_ID_LABEL}" --yes || true

      - name: 'Add pending status to block the merge'
        env:
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }}
        run: |
          WORK_SHA=$(git rev-list -n 1 "origin/${WORK_BRANCH}")
          gh api --method POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 /repos/${{ github.repository }}/statuses/${WORK_SHA} \
                 -f "state=pending" \
                 -f "description=Blocked until staging repository is released to Maven Central." \
                 -f "context=maven-central"

      - name: 'Comment on PR to prompt next phase of the release'
        env:
          GH_TOKEN: ${{ secrets.KROXYLICIOUS_RELEASE_TOKEN }} # For the gh cmd line tool used by stage-release.sh
          RELEASE_BRANCH: ${{ inputs.branch }}
          RELEASE_VERSION: ${{ github.event.inputs.release-version }}
          DEVELOPMENT_VERSION: ${{ github.event.inputs.development-version }}
        run: |
          export REPO="https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}/download"
          envsubst << "EOF" | gh pr comment "${WORK_BRANCH}" --body-file -
          Hey, that's the ${RELEASE_VERSION} release prepared and its artefacts successfully staged to Sonatype. This PR contains a commit for ${RELEASE_VERSION} and a commit for ${DEVELOPMENT_VERSION} which will reopen ${RELEASE_BRANCH} for new work.

          There are a couple of steps to do before the release is completed.

          * [ ] Let the CI workflow on this PR complete
          * [ ] [Kick the tyres](https://github.com/kroxylicious/kroxylicious/blob/main/RELEASING.md#verify-the-release) using the staged Maven artefacts (available at `${REPO}`).
                You can use this Maven snippet in your test project's pom.xml to configure Maven to download from the Portal. You also need to configure Maven to [authenticate](https://central.sonatype.org/publish/publish-portal-api/#maven) using
                your [Sonatype user token](https://central.sonatype.com/account).
            ```
            <repositories>
              <repository>
                <id>central.manual.testing</id>
                <url>${REPO}</url>
              </repository>
            </repositories>
            ```
          * [ ] Approve this PR.

          Once the above is done, comment <code>&commat;kroxylicious-robot promote-release</code> on this PR. This will release the artefacts to Maven Central and merge this PR to ${RELEASE_BRANCH}.
          If things don't look good, abort the release by saying <code>&commat;kroxylicious-robot drop-release</code>.
          
          Thank you,
          Your friendly Kroxylicious Github Robot.
          EOF
